name: Container Image Drift

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-image-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Resolve pinned image tags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 结构设计规范知识库
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compare pinned and remote multi-platform digests
        run: python scripts/validate_container_images.py --check-remote
