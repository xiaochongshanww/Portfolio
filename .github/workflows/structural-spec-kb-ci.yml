name: Structural Spec KB CI

on:
  push:
    paths:
      - "结构设计规范知识库/**"
      - ".github/workflows/structural-spec-kb-ci.yml"
  pull_request:
    paths:
      - "结构设计规范知识库/**"
      - ".github/workflows/structural-spec-kb-ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 2"

permissions:
  contents: read

concurrency:
  group: structural-spec-kb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    name: Dependency lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 结构设计规范知识库
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 结构设计规范知识库/requirements-tools.txt
      - name: Install pinned lock tool
        run: python -m pip install --disable-pip-version-check -r requirements-tools.txt
      - name: Verify dependency locks
        run: python scripts/lock_dependencies.py --check
      - name: Validate immutable CI action references
        run: python scripts/validate_ci_actions.py
      - name: Validate immutable container image references
        run: python scripts/validate_container_images.py
      - name: Validate container security policy
        run: python scripts/validate_container_security.py
      - name: Validate minimal Docker build context
        run: python scripts/validate_docker_context.py

  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: 结构设计规范知识库
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 结构设计规范知识库/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Validate installed dependency graph
        run: python -m pip check
      - name: Check Python static quality
        run: |
          python -m ruff check src scripts tests
          python -m ruff format --check src scripts tests
      - name: Validate OpenAPI snapshot
        run: python scripts/export_openapi.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Validate configuration example
        run: python scripts/validate_configuration_example.py
      - name: Validate source register
        run: python scripts/validate_source_register.py
      - name: Validate quality evidence snapshot
        run: python scripts/snapshot_quality_evidence.py

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 结构设计规范知识库/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 结构设计规范知识库/frontend/package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@10.9.8
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency graph
        run: npm audit --audit-level=high
      - name: Generate and validate frontend API contract
        run: npm run api:check
      - name: Run frontend tests
        run: npm test
      - name: Check frontend types
        run: npm run typecheck
      - name: Build production console
        run: npm run build

  package-producer:
    name: Package producer (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [dependency-lock, backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    defaults:
      run:
        working-directory: 结构设计规范知识库
    env:
      ANONYMIZED_TELEMETRY: "FALSE"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 结构设计规范知识库/requirements-runtime.txt
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-runtime.txt
      - name: Validate installed dependency graph
        run: python -m pip check
      - name: Create real Chroma package
        run: python -m scripts.create_portability_package --output dist/portability-${{ matrix.platform }}.zip
      - name: Verify package upgrade and rollback
        run: python -m scripts.verify_runtime_package_recovery
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portability-${{ matrix.platform }}
          path: 结构设计规范知识库/dist/portability-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 7

  package-portability:
    name: Package portability (${{ matrix.source }} -> ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: package-producer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            source: windows
            target: linux
          - os: windows-latest
            source: linux
            target: windows
    defaults:
      run:
        working-directory: 结构设计规范知识库
    env:
      ANONYMIZED_TELEMETRY: "FALSE"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 结构设计规范知识库/requirements-runtime.txt
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-runtime.txt
      - name: Validate installed dependency graph
        run: python -m pip check
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portability-${{ matrix.source }}
          path: 结构设计规范知识库/dist
      - name: Import and probe foreign package
        run: >-
          python -m src.pipeline package-probe
          --package dist/portability-${{ matrix.source }}.zip
          --expect-source-platform ${{ matrix.source }}
          --require-cross-platform
      - name: Cold start API from foreign package
        run: >-
          python -m scripts.verify_runtime_package_cold_start
          --package dist/portability-${{ matrix.source }}.zip
          --expect-source-platform ${{ matrix.source }}
          --require-cross-platform

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [dependency-lock, backend, frontend]
    defaults:
      run:
        working-directory: 结构设计规范知识库
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render Compose with documented example
        run: docker compose --env-file .env.example config --quiet
      - name: Build runtime image
        run: >-
          docker build
          --build-arg APP_UID="$(id -u)"
          --build-arg APP_GID="$(id -g)"
          --tag structural-spec-kb:ci
          .
      - name: Start runtime image
        run: docker run --detach --name structural-spec-kb-ci --publish 8000:8000 structural-spec-kb:ci
      - name: Verify health and bundled console
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs structural-spec-kb-ci
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/static/index.html >/dev/null
      - name: Verify non-root runtime identity and write access
        run: |
          test "$(docker exec structural-spec-kb-ci id -u)" != "0"
          docker exec structural-spec-kb-ci sh -c 'test -w /app/data'
          docker exec structural-spec-kb-ci sh -c 'touch /app/data/.ci-write-probe && rm /app/data/.ci-write-probe'
      - name: Prepare container security artifacts
        run: mkdir -p artifacts/container-security
      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: true
      - name: Record scanner identity
        run: |
          trivy version > artifacts/container-security/trivy-version.txt
          cat artifacts/container-security/trivy-version.txt
      - name: Generate runtime image SPDX SBOM
        run: >-
          trivy image
          --format spdx-json
          --output artifacts/container-security/container-sbom.spdx.json
          --timeout 10m
          structural-spec-kb:ci
      - name: Capture complete runtime vulnerability report
        run: >-
          trivy image
          --scanners vuln
          --pkg-types os,library
          --format json
          --output artifacts/container-security/container-vulnerabilities.json
          --timeout 10m
          structural-spec-kb:ci
      - name: Enforce fixable high and critical vulnerability gate
        run: >-
          trivy image
          --scanners vuln
          --pkg-types os,library
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --ignorefile .trivyignore.yaml
          --exit-code 1
          --timeout 10m
          structural-spec-kb:ci
      - name: Upload container SBOM and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-${{ github.sha }}
          path: 结构设计规范知识库/artifacts/container-security/
          if-no-files-found: warn
          retention-days: 14
      - name: Show container logs on failure
        if: failure()
        run: docker logs structural-spec-kb-ci
      - name: Stop runtime image
        if: always()
        run: docker rm --force structural-spec-kb-ci

  openwebui:
    name: OpenWebUI authenticated integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [dependency-lock, backend, frontend]
    defaults:
      run:
        working-directory: 结构设计规范知识库
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure synthetic connection credentials
        run: |
          cat > .env <<'EOF'
          API_AUTH_ENABLED=true
          API_KEYS=ci-openwebui-connection-key
          OPENWEBUI_API_KEY=ci-openwebui-connection-key
          ASSET_SIGNING_KEY=ci-openwebui-signing-key-0000000000000000
          OPENWEBUI_AUTH=false
          RATE_LIMIT_ENABLED=false
          MIMO_MODEL=mimo-v2-omni
          STRUCTURAL_SPEC_KB_IMAGE_TAG=ci-openwebui
          EOF
      - name: Build shared application image
        run: >-
          docker build
          --build-arg APP_UID="$(id -u)"
          --build-arg APP_GID="$(id -g)"
          --tag structural-spec-kb:ci-openwebui
          .
      - name: Pull external Compose images with bounded retry
        run: >-
          python scripts/pull_compose_images.py
          --attempts 5
          --initial-delay 2
          --max-delay 30
          --attempt-timeout 600
          --policy always
          open-webui
      - name: Start authenticated Compose stack
        run: docker compose up --no-build --pull never --detach open-webui
      - name: Verify preflight and OpenWebUI model discovery
        run: |
          test "$(docker exec rag-api id -u)" != "0"
          docker exec rag-api sh -c 'test -w /app/data'
          docker exec rag-api sh -c 'touch /app/data/.ci-compose-write-probe && rm /app/data/.ci-compose-write-probe'
          test "$(docker inspect --format '{{.State.ExitCode}}' openwebui-preflight)" = "0"
          docker compose logs --no-color openwebui-preflight | grep --fixed-strings '"ok": true'
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done
          for attempt in {1..30}; do
            if curl --fail --silent \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"email":"admin@localhost","password":"admin"}' \
              http://127.0.0.1:3000/api/v1/auths/signin > /tmp/openwebui-session.json; then
              OPENWEBUI_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("token", ""))' < /tmp/openwebui-session.json)"
              if [ -n "$OPENWEBUI_TOKEN" ]; then
                break
              fi
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done
          for attempt in {1..30}; do
            if curl --fail --silent \
              --header "Authorization: Bearer $OPENWEBUI_TOKEN" \
              http://127.0.0.1:3000/api/models > /tmp/openwebui-models.json \
              && python -c 'import json,sys; data=json.load(sys.stdin).get("data", []); assert any(item.get("id") == "mimo-v2-omni" for item in data)' < /tmp/openwebui-models.json; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/openwebui-models.json || true
          exit 1
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop authenticated Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
