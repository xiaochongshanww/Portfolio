name: Structural Spec KB CI

on:
  push:
    paths:
      - "结构设计规范知识库/**"
      - ".github/workflows/structural-spec-kb-ci.yml"
  pull_request:
    paths:
      - "结构设计规范知识库/**"
      - ".github/workflows/structural-spec-kb-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structural-spec-kb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 结构设计规范知识库
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 结构设计规范知识库/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 结构设计规范知识库/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 结构设计规范知识库/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production console
        run: npm run build

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: 结构设计规范知识库
    steps:
      - uses: actions/checkout@v6
      - name: Build runtime image
        run: docker build --tag structural-spec-kb:ci .
      - name: Start runtime image
        run: docker run --detach --name structural-spec-kb-ci --publish 8000:8000 structural-spec-kb:ci
      - name: Verify health and bundled console
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs structural-spec-kb-ci
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/static/index.html >/dev/null
      - name: Show container logs on failure
        if: failure()
        run: docker logs structural-spec-kb-ci
      - name: Stop runtime image
        if: always()
        run: docker rm --force structural-spec-kb-ci
