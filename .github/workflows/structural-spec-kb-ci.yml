name: Structural Spec KB CI

on:
  push:
    paths:
      - "结构设计规范知识库/**"
      - ".github/workflows/structural-spec-kb-ci.yml"
  pull_request:
    paths:
      - "结构设计规范知识库/**"
      - ".github/workflows/structural-spec-kb-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structural-spec-kb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    name: Dependency lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 结构设计规范知识库
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 结构设计规范知识库/requirements-tools.txt
      - name: Install pinned lock tool
        run: python -m pip install --disable-pip-version-check -r requirements-tools.txt
      - name: Verify dependency locks
        run: python scripts/lock_dependencies.py --check

  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: 结构设计规范知识库
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 结构设计规范知识库/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 结构设计规范知识库/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 结构设计规范知识库/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency graph
        run: npm audit --audit-level=high
      - name: Build production console
        run: npm run build

  package-producer:
    name: Package producer (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [dependency-lock, backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    defaults:
      run:
        working-directory: 结构设计规范知识库
    env:
      ANONYMIZED_TELEMETRY: "FALSE"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 结构设计规范知识库/requirements-runtime.txt
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-runtime.txt
      - name: Create real Chroma package
        run: python -m scripts.create_portability_package --output dist/portability-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.platform }}
          path: 结构设计规范知识库/dist/portability-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 7

  package-portability:
    name: Package portability (${{ matrix.source }} -> ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: package-producer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            source: windows
            target: linux
          - os: windows-latest
            source: linux
            target: windows
    defaults:
      run:
        working-directory: 结构设计规范知识库
    env:
      ANONYMIZED_TELEMETRY: "FALSE"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 结构设计规范知识库/requirements-runtime.txt
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-runtime.txt
      - uses: actions/download-artifact@v4
        with:
          name: portability-${{ matrix.source }}
          path: 结构设计规范知识库/dist
      - name: Import and probe foreign package
        run: >-
          python -m src.pipeline package-probe
          --package dist/portability-${{ matrix.source }}.zip
          --expect-source-platform ${{ matrix.source }}
          --require-cross-platform

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [dependency-lock, backend, frontend]
    defaults:
      run:
        working-directory: 结构设计规范知识库
    steps:
      - uses: actions/checkout@v6
      - name: Build runtime image
        run: docker build --tag structural-spec-kb:ci .
      - name: Start runtime image
        run: docker run --detach --name structural-spec-kb-ci --publish 8000:8000 structural-spec-kb:ci
      - name: Verify health and bundled console
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs structural-spec-kb-ci
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/static/index.html >/dev/null
      - name: Show container logs on failure
        if: failure()
        run: docker logs structural-spec-kb-ci
      - name: Stop runtime image
        if: always()
        run: docker rm --force structural-spec-kb-ci
