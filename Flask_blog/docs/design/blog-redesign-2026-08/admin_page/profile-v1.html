<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人中心 · 小重山 CMS</title>
<style>
:root{--bg:#f6f7f8;--s:#fff;--t:#18181b;--t2:#3f3f46;--m:#71717a;--l:#e4e4e7;--p:#2563eb;--ps:#eff6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}button{cursor:pointer}
.top{height:58px;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.crumb{display:flex;gap:7px;color:var(--m);font-size:12px}.crumb b{color:var(--t2)}.btn{height:34px;padding:0 11px;border:1px solid var(--l);border-radius:8px;background:#fff;color:var(--t2);font-size:13px}
.work{padding:32px}.content{max-width:1440px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.head h1{margin:0;font-size:28px;letter-spacing:-.04em}.head p{margin:8px 0 0;color:var(--m);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--l);border-radius:12px;overflow:hidden}.chead{padding:14px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.chead h2{font-size:14px;margin:0}.body{padding:16px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:14px;padding:12px 0;border-top:1px solid #eee;font-size:13px}.kv:first-child{border-top:0}.kv label{color:var(--m)}
.status{font-size:12px;font-weight:650}.ok{color:var(--ok)}.warn{color:var(--w)}
</style></head><body>
<header class="top"><div class="crumb"><span>设置</span><span>/</span><b>个人中心</b></div><button class="btn">↗ 返回网站</button></header>
<div class="work"><div class="content">

<section class="head"><div><h1>个人中心</h1><p>管理你的个人资料与账户安全。</p></div></section>
<div class="grid">
<section class="card"><div class="chead"><h2>基本资料</h2></div><div class="body">
<div class="kv"><label>昵称</label><div>小重山</div></div>
<div class="kv"><label>邮箱</label><div>manual@verify.com</div></div>
<div class="kv"><label>个人简介</label><div>Python · AI · 软件工程 · 产品实践</div></div>
<div class="kv"><label>头像</label><div>当前头像 · 点击更换</div></div>
</div></section>
<section class="card"><div class="chead"><h2>账户安全</h2></div><div class="body">
<div class="kv"><label>修改密码</label><div>定期更新密码有助于账户安全</div></div>
<div class="kv"><label>双因子认证</label><div>未启用</div></div>
</div></section>
</div>
</div></body></html>
