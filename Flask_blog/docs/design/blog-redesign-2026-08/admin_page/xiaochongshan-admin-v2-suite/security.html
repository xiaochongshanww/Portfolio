<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安全中心 · 小重山 CMS</title><style>
:root{
  --bg:#f6f7f8;--surface:#fff;--surface2:#fafafa;--text:#18181b;--text2:#3f3f46;
  --muted:#71717a;--muted2:#a1a1aa;--line:#e4e4e7;--line2:#d4d4d8;
  --primary:#2563eb;--primary-soft:#eff6ff;--success:#15803d;--warning:#b45309;--danger:#b91c1c;
  --sidebar:228px;--topbar:58px;--content-max:1440px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit}button,input,select{font:inherit}button{cursor:pointer}
.admin{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{height:var(--topbar);padding:0 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);font-weight:760}
.mark{width:29px;height:29px;border-radius:8px;background:var(--text);color:#fff;display:grid;place-items:center;font-size:11px}
.navs{padding:16px 10px;flex:1;overflow:auto}.group{margin-bottom:20px}.group small{display:block;padding:0 10px 7px;color:var(--muted2);font-size:11px;font-weight:650}
.nav{height:40px;padding:0 10px;display:flex;align-items:center;gap:10px;border-radius:8px;font-size:13px;color:var(--text2)}
.nav:hover{background:#f7f7f8}.nav.active{background:var(--primary-soft);color:var(--primary);font-weight:650}.nav span:first-child{width:18px;text-align:center}
.nav em{margin-left:auto;background:#f4f4f5;color:var(--muted);font-style:normal;font-size:10px;padding:2px 7px;border-radius:999px}
.account{padding:10px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}.avatar{width:32px;height:32px;border-radius:9px;background:#eef2f7;display:grid;place-items:center;font-weight:700;color:#475569}
.account b{display:block;font-size:12px}.account small{font-size:10px;color:var(--muted)}
.main{min-width:0}.topbar{height:var(--topbar);position:sticky;top:0;z-index:20;padding:0 28px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:7px}.crumb b{color:var(--text2)}.btn{height:34px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text2);font-size:12px}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:650}.btn.danger{color:var(--danger)}
.workspace{padding:32px}.content{width:min(100%,var(--content-max));margin:0 auto}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.pagehead h1{font-size:28px;letter-spacing:-.04em;margin:0}.pagehead p{font-size:14px;color:var(--muted);margin:8px 0 0}
.summary{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.sum{padding:18px 20px;border-right:1px solid var(--line)}.sum:last-child{border-right:0}.sum label{font-size:12px;color:var(--muted)}.sum strong{display:block;font-size:27px;margin-top:7px}.sum small{font-size:11px;color:var(--muted2)}
.toolbar{padding:12px;border:1px solid var(--line);border-radius:12px 12px 0 0;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}
.left,.right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.search{height:34px;width:320px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.select{height:34px;padding:0 28px 0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text2);font-size:12px}
.tablecard{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:#fff;overflow:hidden}.wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:920px}th{height:42px;padding:0 14px;text-align:left;background:var(--surface2);color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}
td{padding:13px 14px;border-bottom:1px solid #eeeeef;font-size:12px;color:var(--text2);vertical-align:middle}tbody tr:hover{background:#fcfcfd}tr:last-child td{border-bottom:0}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650}.dot{width:6px;height:6px;border-radius:50%}.ok{color:var(--success)}.ok .dot{background:#22c55e}.warn{color:var(--warning)}.warn .dot{background:#f59e0b}.off{color:var(--muted)}.off .dot{background:#a1a1aa}.bad{color:var(--danger)}.bad .dot{background:#ef4444}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:#f4f4f5;color:var(--muted);font-size:10px}.pill.blue{background:var(--primary-soft);color:var(--primary)}
.tablefoot{min-height:48px;padding:8px 12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.chead{height:46px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.chead h2{font-size:14px;margin:0}.body{padding:16px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:14px;padding:12px 0;border-top:1px solid #eeeeef;font-size:12px}.kv:first-child{border-top:0}.kv label{color:var(--muted)}
.empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:12px}.empty b{display:block;color:var(--text2);font-size:13px;margin-bottom:6px}
@media(max-width:1050px){:root{--sidebar:204px}.workspace{padding:24px}.summary{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:720px){.admin{grid-template-columns:1fr}.sidebar{display:none}.workspace{padding:18px}.topbar{padding:0 18px}.summary{grid-template-columns:1fr}.sum{border-right:0;border-bottom:1px solid var(--line)}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.pagehead h1{font-size:24px}}
</style></head><body>
<div class="admin">
<aside class="sidebar"><div class="brand"><span class="mark">山</span><span>小重山 CMS</span></div><div class="navs"><div class="group"><small>工作台</small><a class="nav" href="dashboard.html"><span>⌂</span><span>仪表盘</span></a></div><div class="group"><small>内容</small><a class="nav" href="article.html"><span>▤</span><span>文章</span><em>47</em></a><a class="nav" href="comments.html"><span>◉</span><span>评论</span><em>2</em></a></div><div class="group"><small>组织</small><a class="nav" href="topics.html"><span>◫</span><span>专题</span></a><a class="nav" href="tags.html"><span>#</span><span>标签</span></a><a class="nav" href="projects.html"><span>◇</span><span>项目</span></a></div><div class="group"><small>资源</small><a class="nav" href="media.html"><span>▧</span><span>媒体</span></a></div><div class="group"><small>系统</small><a class="nav" href="users.html"><span>○</span><span>用户</span></a><a class="nav active" href="security.html"><span>□</span><span>安全</span></a><a class="nav" href="logs.html"><span>≡</span><span>日志</span></a><a class="nav" href="settings.html"><span>⚙</span><span>设置</span></a></div></div><div class="account"><span class="avatar">M</span><span><b>manual@verify.com</b><small>管理员</small></span></div></aside>
<main class="main"><header class="topbar"><div class="crumb"><span>系统</span><span>/</span><b>安全</b></div><button class="btn">↗ 返回网站</button></header><div class="workspace"><div class="content">
<section class="pagehead"><div><h1>安全中心</h1><p>查看账户、会话和后台访问安全状态。</p></div><div></div></section>
<div class="grid2"><section class="card"><div class="chead"><h2>安全状态</h2><span class="status ok"><i class="dot"></i>正常</span></div><div class="body"><div class="kv"><label>最近异常登录</label><div>无</div></div><div class="kv"><label>失败登录</label><div>0 次 / 24h</div></div><div class="kv"><label>管理员账号</label><div>1 个</div></div></div></section>
<section class="card"><div class="chead"><h2>安全策略</h2></div><div class="body"><div class="kv"><label>强密码要求</label><div>已启用</div></div><div class="kv"><label>登录限流</label><div>已启用</div></div><div class="kv"><label>双因素认证</label><div>未启用</div></div></div></section></div>
<section class="card" style="margin-top:18px"><div class="chead"><h2>最近安全事件</h2></div><div class="empty"><b>暂无异常事件</b>过去 30 天未检测到需要处理的安全事件。</div></section>
</div></div></main></div></body></html>
