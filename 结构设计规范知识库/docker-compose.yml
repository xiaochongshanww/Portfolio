name: structural-spec-kb

services:
  api:
    build: .
    image: structural-spec-kb:${STRUCTURAL_SPEC_KB_IMAGE_TAG:-local}
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - rag-net

  openwebui-preflight:
    image: structural-spec-kb:${STRUCTURAL_SPEC_KB_IMAGE_TAG:-local}
    container_name: openwebui-preflight
    command: ["python", "-m", "src.app.core.openwebui_probe"]
    env_file:
      - path: .env
        required: false
    environment:
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
      MIMO_MODEL: ${MIMO_MODEL:-mimo-v2.5}
      OPENAI_API_BASE_URLS: http://api:8000/v1
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    networks:
      - rag-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.5
    container_name: open-webui
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
      openwebui-preflight:
        condition: service_completed_successfully
    environment:
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      ENABLE_PERSISTENT_CONFIG: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_BASE_URLS: http://api:8000/v1
      OPENAI_API_KEYS: ${OPENWEBUI_API_KEY:-not-needed}
      WEBUI_AUTH: ${OPENWEBUI_AUTH:-true}
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - rag-net

networks:
  rag-net:
    driver: bridge

volumes:
  open-webui-data:
