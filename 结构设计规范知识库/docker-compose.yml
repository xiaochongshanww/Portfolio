name: structural-spec-kb

services:
  api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - rag-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.5
    container_name: open-webui
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://api:8000/v1
      - OPENAI_API_KEY=${OPENWEBUI_API_KEY:-not-needed}
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - rag-net

networks:
  rag-net:
    driver: bridge

volumes:
  open-webui-data:
